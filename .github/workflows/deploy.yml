name: Deploy Atividade 3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar deploy no servidor via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: gr.lab.ayty.org
          username: gr-jamilly-santos
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          script: |
            gr-docker network create dados --interna || true
            gr-docker network create web || true
            gr-docker volume create pgdata || true

            gr-docker rm -f banco || true
            gr-docker rm -f api || true
            gr-docker rm -f front || true

            gr-docker run -d \
              --name banco \
              --network dados \
              -v pgdata:/var/lib/postgresql/data \
              -e POSTGRES_PASSWORD=${{ secrets.DB_SENHA }} \
              -e POSTGRES_DB=pokedex \
              postgres:17-alpine

            gr-docker run -d \
              --name api \
              --network dados \
              -e POSTGRES_HOST=gr-jamilly-santos-banco \
              -e POSTGRES_DB=pokedex \
              -e POSTGRES_PASSWORD=${{ secrets.DB_SENHA }} \
              gr-atv2-api:1

            gr-docker network connect web api

            gr-docker run -d \
              --name front \
              --network web \
              -p 23130:80 \
              -e API=gr-jamilly-santos-api \
              gr-atv2-front:1
